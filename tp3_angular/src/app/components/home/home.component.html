<div class="container mt-4">
  <h1 class="text-center mb-4">Liste des Voyages</h1>
  @if (paginatedVoyages.length > 0) {
    <div class="row">
      @for (voyage of paginatedVoyages; track voyage.id) {
        <div class="col-md-4 mb-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">{{ voyage.destination }}</h5>
              <p class="card-text">{{ voyage.description | slice:0:20 }}...</p>
              <p class="card-text"><strong>{{ voyage.prix | currency:'EUR' }}</strong></p>
              <div class="d-flex justify-content-between">
                <a [routerLink]="['/voyage', voyage.id]" class="btn btn-primary">Voir</a>
                <button class="btn btn-danger" (click)="deleteVoyage(voyage.id)">Supprimer</button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
    <div class="d-flex justify-content-center mt-4">
      <button class="btn btn-secondary me-2" (click)="previousPage()" [disabled]="currentPage === 1">Précédent</button>
      <span>Page {{ currentPage }}</span>
      <button class="btn btn-secondary ms-2" (click)="nextPage()" [disabled]="currentPage * itemsPerPage >= voyages.length">Suivant</button>
    </div>
  } @else {
    <p class="text-center">Aucun voyage disponible.</p>
  }
</div>
