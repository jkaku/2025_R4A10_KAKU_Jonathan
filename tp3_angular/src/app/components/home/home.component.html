<div class="container mt-4">
  <h1 class="text-center">Liste des Voyages</h1>

  <div *ngIf="voyages.length === 0" class="text-center mt-4">
    <p>Aucun voyage disponible.</p>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let voyage of paginatedVoyages">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ voyage.destination }}</h5>
          <p class="card-text">{{ voyage.description | slice:0:20 }}...</p>
          <p class="card-text"><strong>Prix :</strong> {{ voyage.prix | currency:'EUR' }}</p>
          <div class="d-flex justify-content-between">
            <a [routerLink]="['/voyage', voyage.id]" class="btn btn-primary">Voir Détails</a>
            <button class="btn btn-danger" (click)="deleteVoyage(voyage.id)">Supprimer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav aria-label="Page navigation" *ngIf="voyages.length > itemsPerPage">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="previousPage()">Précédent</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="nextPage()">Suivant</button>
      </li>
    </ul>
  </nav>
</div>
